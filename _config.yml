# Cấu hình website buivandat.com (Jekyll – GitHub Pages tự build)
title: buivandat.com
tagline: Tin tức, phần mềm & kinh nghiệm MMO
description: buivandat.com – nơi Đạt chia sẻ tin tức, phần mềm và kinh nghiệm kiếm tiền online (MMO) thực chiến, minh bạch, dễ áp dụng.
url: https://buivandat.com
baseurl: ""
lang: vi_VN
timezone: Asia/Ho_Chi_Minh
email: contact@buivandat.com
logo: /assets/img/icon-512.png
image: /assets/img/og-image.png

# Xác minh chủ sở hữu với công cụ tìm kiếm (bỏ dấu # và dán mã vào):
# verification:
#   google: MA_XAC_MINH_GOOGLE_SEARCH_CONSOLE
#   bing: MA_XAC_MINH_BING_WEBMASTER
author:
  name: Bùi Văn Đạt
  email: contact@buivandat.com
  # Ảnh chân dung (không bắt buộc): đặt ảnh vào assets/img/ rồi bỏ dấu # ở dòng dưới
  # photo: /assets/img/dat.jpg

permalink: /blog/:title/
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  transliterated_header_ids: true
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Bùi Văn Đạt

exclude:
  - README.md
  - CNAME
  - scripts
  - music
  - crawler
  - package.json
  - package-lock.json
  - node_modules
  - Gemfile
  - Gemfile.lock
  - vendor
