<footer class="footer">
  <div class="container">
    <div class="footer__top">
      <p class="footer__big">Làm MMO<br>một cách <em>tử tế</em>.</p>
      <div class="footer__cols">
        <div>
          <h2 class="label">Đọc</h2>
          <a href="/blog/">Tất cả bài viết</a>
          {%- for c in site.data.categories %}
          <a href="/blog/?cat={{ c[0] }}">{{ c[1].name }}</a>
          {%- endfor %}
        </div>
        <div>
          <h2 class="label">Kết nối</h2>
          <a href="mailto:{{ site.email }}">{{ site.email }}</a>
          <a href="/feed.xml">RSS</a>
          <a href="/#ve-minh">Về Đạt</a>
        </div>
      </div>
    </div>
    <div class="footer__bottom">
      <a class="brand brand--light" href="/">
        <img class="brand__seal" src="/assets/img/logo-mark.svg" alt="" width="30" height="30">
        <span class="brand__name">buivandat<em>.com</em></span>
      </a>
      <small>© <span id="year">{{ site.time | date: "%Y" }}</span> Bùi Văn Đạt. Nội dung mang tính chia sẻ kinh nghiệm, không phải lời khuyên đầu tư.</small>
      <a href="#top" class="to-top" aria-label="Lên đầu trang">↑</a>
    </div>
  </div>
</footer>
<div class="toast" role="status" aria-live="polite"></div>
<script src="/assets/js/main.js" defer></script>
