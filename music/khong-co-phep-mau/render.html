<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../assets/media/khong-co-phep-mau/scene.js"></script>
<script>
  window.ready = (async () => {
    const data = await (await fetch('../../assets/media/khong-co-phep-mau/song.json')).json();
    await Promise.all([400, 500, 600, 700].map(w => document.fonts.load(w + ' 40px "Be Vietnam Pro"', 'Đạt ẩ')));
    window.video = KhongCoPhepMau.create(document.getElementById('c'), data);
    return data.duration;
  })();
  window.frame = (t, q) => { video.draw(t); return document.getElementById('c').toDataURL('image/jpeg', q || 0.92); };
</script></body></html>
