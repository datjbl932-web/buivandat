# datvps - nginx của 1 site (đứng sau nginx-proxy)

# IP thật của khách: tin header từ proxy nội bộ Docker và Cloudflare.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    server_tokens off;
    client_max_body_size 256m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { try_files $uri /index.php?$args; access_log off; log_not_found off; }

    # Chặn file ẩn (.git, .env, .htaccess...) trừ .well-known
    location ~ /\.(?!well-known/) { deny all; }

    # Chặn file nhạy cảm và xmlrpc (brute-force)
    location ~* ^/(wp-config\.php|readme\.html|license\.txt|xmlrpc\.php)$ { deny all; }

    # Không cho chạy PHP trong thư mục upload
    location ~* ^/wp-content/uploads/.*\.(php|phtml|phar|php\d)$ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~* \.(css|js|mjs|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }
}
