# datvps - stack WordPress cô lập cho 1 site.
# Mọi giá trị riêng của site nằm trong .env cùng thư mục (compose tự nạp).
x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
  WORDPRESS_TABLE_PREFIX: ${DB_PREFIX:-wp_}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_REDIS_HOST', 'redis');
    define('WP_REDIS_PORT', 6379);
    define('WP_REDIS_PASSWORD', getenv_docker('REDIS_PASSWORD', ''));
    define('WP_REDIS_PREFIX', '${SITE_ID}:');
    define('WP_CACHE_KEY_SALT', '${SITE_ID}:');
    define('DISALLOW_FILE_EDIT', true);
    define('FS_METHOD', 'direct');
    define('WP_AUTO_UPDATE_CORE', 'minor');

services:
  db:
    <<: *base
    image: ${DB_IMAGE:-mariadb:11.4}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-128M}
      - --max-connections=100
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${MEM_DB:-512m}
    networks: [backend]

  redis:
    <<: *base
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    mem_limit: ${MEM_REDIS:-192m}
    networks: [backend]

  php:
    <<: *base
    image: ${PHP_IMAGE:-wordpress:php8.3-fpm}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment: *wp-env
    volumes:
      - ./wordpress:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/zz-datvps.ini:ro
    mem_limit: ${MEM_PHP:-512m}
    networks: [backend]

  web:
    <<: *base
    image: ${WEB_IMAGE:-nginx:1.27-alpine}
    depends_on: [php]
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: "80"
    volumes:
      - ./wordpress:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: ${MEM_WEB:-128m}
    networks: [backend, proxy]

  # Chỉ chạy khi gọi: dat wp <site> ...
  cli:
    image: ${CLI_IMAGE:-wordpress:cli-php8.3}
    profiles: [tools]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - ./wordpress:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/zz-datvps.ini:ro
    networks: [backend]

networks:
  backend: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-datvps_proxy}
